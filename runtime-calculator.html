<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtime Risk Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #FBF0E5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .card-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .value {
      font-size: 32px;
      color: #E18984;
    }
    .benchmark {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 500px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .benchmark-chart {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 100px;
      margin-top: 20px;
    }
    .benchmark-bar {
      width: 45%;
      background: #ccc;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      font-weight: bold;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5px;
    }
    .runtime-bar {
      background-color: #E18984;
      height: 15%;
    }
    .traditional-bar {
      background-color: #999;
      height: 60%;
    }
    button {
      background: #E18984;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #cf7470;
    }
  </style>
</head>
<body>
  <h1>Runtime Risk Calculator</h1>

  <div class="form-container">
    <label for="apps"># of Applications:</label>
    <input type="number" id="apps" placeholder="e.g. 5" />

    <label for="loc">Total Lines of Code (LOC):</label>
    <input type="number" id="loc" placeholder="e.g. 1000000" />

    <label for="vuln"># of Known Vulnerabilities:</label>
    <input type="number" id="vuln" placeholder="e.g. 120" />

    <button onclick="calculate()">Calculate</button>
  </div>

  <div class="card-container">
    <div class="card">
      <div>Exploit-Reachable Vulnerabilities</div>
      <div class="value" id="vulnerabilities">-</div>
    </div>
    <div class="card">
      <div>Engineering Hours Reclaimed</div>
      <div class="value" id="hours">-</div>
    </div>
    <div class="card">
      <div>Compliance Controls Passed/Remaining</div>
      <div class="value" id="compliance">-</div>
    </div>
  </div>

  <div class="benchmark">
    <strong>Exposure Delta Benchmark</strong>
    <p>Compare the percentage of truly reachable vulnerabilities with and without Kodem:</p>
    <div class="benchmark-chart">
      <div class="benchmark-bar runtime-bar">15%<br>Kodem Runtime</div>
      <div class="benchmark-bar traditional-bar">60%<br>Traditional SAST/SCA</div>
    </div>
  </div>

  <script>
    function calculate() {
      const apps = parseInt(document.getElementById('apps').value) || 0;
      const loc = parseInt(document.getElementById('loc').value) || 0;
      const vuln = parseInt(document.getElementById('vuln').value) || 0;

      const reachable = Math.round(vuln * 0.3);
      const hoursSaved = Math.round(reachable * 2);
      const compliancePassed = Math.min(30, apps * 6);
      const complianceRemaining = 32 - compliancePassed;

      document.getElementById('vulnerabilities').textContent = `${reachable}`;
      document.getElementById('hours').textContent = `${hoursSaved}`;
      document.getElementById('compliance').textContent = `${compliancePassed} / ${complianceRemaining}`;
    }
  </script>
</body>
</html>
